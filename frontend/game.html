<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relay — Daily Word Chain</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple-bg: #7B74C2;
      --purple-card: #8B85CE;
      --purple-deep: #6960B0;
      --purple-pill: #9D98D8;
      --gold: #F5C518;
      --gold-dim: #D4A800;
      --dark-input: #2A2A2A;
      --text-white: #FFFFFF;
      --text-muted: rgba(255,255,255,0.55);
      --text-pill: rgba(255,255,255,0.9);
    }

    body {
      min-height: 100vh;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
    }

    .phone-shell {
      width: 390px;
      min-height: 780px;
      background: var(--purple-bg);
      border-radius: 44px;
      padding: 36px 28px 40px;
      display: flex;
      flex-direction: column;
      gap: 0;
      box-shadow: 0 40px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
      position: relative;
    }

    /* ── TOP BAR ── */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 28px;
    }

    .menu-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 2px solid rgba(255,255,255,0.25);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .menu-btn svg { stroke: rgba(255,255,255,0.7); }

    .score-block { text-align: right; line-height: 1; }
    .score-num {
      font-size: 40px;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: -1px;
      line-height: 1;
    }
    .score-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--gold-dim);
    }

    /* ── CHAIN PROGRESS PILLS ── */
    .chain-track {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 22px;
    }

    .chain-pill {
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.06em;
      white-space: nowrap;
      border: 2px solid rgba(255,255,255,0.2);
      background: var(--purple-pill);
      color: var(--text-pill);
      position: relative;
    }
    .chain-pill .highlight {
      color: var(--gold);
    }
    .chain-pill.current {
      background: var(--purple-deep);
      border-color: rgba(255,255,255,0.3);
      color: rgba(255,255,255,0.5);
    }
    .chain-pill.current .dots {
      color: rgba(255,255,255,0.5);
    }

    .chain-connector {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      flex-shrink: 0;
    }

    /* ── CHAIN FROM CARD ── */
    .chain-card {
      background: var(--purple-card);
      border-radius: 18px;
      padding: 24px 22px 22px;
      margin-bottom: 18px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
    }

    .chain-from-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .chain-fragment {
      font-size: 64px;
      font-weight: 900;
      color: var(--gold);
      line-height: 1;
      margin-bottom: 14px;
      letter-spacing: -2px;
    }

    .chain-hint {
      font-family: 'Nunito', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* ── INPUT ── */
    .word-input {
      width: 100%;
      background: var(--dark-input);
      border: none;
      border-radius: 14px;
      padding: 18px 20px;
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      font-weight: 500;
      color: var(--text-white);
      outline: none;
      margin-bottom: 12px;
      transition: box-shadow 0.2s;
    }
    .word-input::placeholder { color: rgba(255,255,255,0.35); }
    .word-input:focus { box-shadow: 0 0 0 2px var(--gold); }

    /* ── SUBMIT ── */
    .submit-btn {
      width: 100%;
      background: #7b74c2;
      border: 2px solid rgba(255,255,255,0.18);
      border-radius: 14px;
      padding: 18px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.18em;
      color: var(--text-white);
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.15s, transform 0.1s;
      margin-bottom: 28px;
    }
    .submit-btn:hover { background: rgba(255,255,255,0.2); }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:not(:hover):not(:active) { background: #7b74c2; }

    /* ── WORDS USED ── */
    .words-used-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .words-used-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .used-pill {
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-pill);
    }

    /* ── FEEDBACK TOAST ── */
    .toast {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: #2A2A2A;
      color: var(--gold);
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      z-index: 10;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { color: #ff6b6b; }
    .toast.success { color: var(--gold); }
  </style>
</head>
<body>
  <div class="phone-shell">
    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Top bar -->
    <div class="top-bar">
      <button class="menu-btn" aria-label="Menu">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke-width="2" stroke-linecap="round">
          <line x1="0" y1="2" x2="16" y2="2"/>
          <line x1="0" y1="10" x2="16" y2="10"/>
        </svg>
      </button>
      <div class="score-block">
        <div class="score-num" id="scoreNum">14</div>
        <div class="score-label">SCORE</div>
      </div>
    </div>

    <!-- Chain track -->
    <div class="chain-track" id="chainTrack">
      <div class="chain-pill"><span class="highlight">SH</span>ARP</div>
      <div class="chain-connector"></div>
      <div class="chain-pill"><span class="highlight">ARR</span>OWN</div>
      <div class="chain-connector"></div>
      <div class="chain-pill current"><span class="dots">WN•••</span></div>
    </div>

    <!-- Chain from card -->
    <div class="chain-card">
      <div class="chain-from-label">CHAIN FROM</div>
      <div class="chain-fragment" id="chainFragment">WN</div>
      <div class="chain-hint">YOUR NEXT WORD MUST START WITH <span id="hintFragment">WN</span></div>
    </div>

    <!-- Input -->
    <input
      class="word-input"
      id="wordInput"
      type="text"
      placeholder="Type your word..."
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
    />

    <!-- Submit -->
    <button class="submit-btn" id="submitBtn">SUBMIT</button>

    <!-- Words used -->
    <div class="words-used-label">WORDS USED</div>
    <div class="words-used-list" id="wordsUsed">
      <div class="used-pill">SHARP</div>
      <div class="used-pill">ARROWN</div>
    </div>
  </div>

  <script>
    // Game state
    const state = {
      score: 14,
      wordsUsed: ['SHARP', 'ARROWN'],
      currentFragment: 'WN',
      // Each word ends with letters → next must start with last 2 letters
    };

    const scoreNum = document.getElementById('scoreNum');
    const chainFragment = document.getElementById('chainFragment');
    const hintFragment = document.getElementById('hintFragment');
    const wordInput = document.getElementById('wordInput');
    const submitBtn = document.getElementById('submitBtn');
    const wordsUsedEl = document.getElementById('wordsUsed');
    const chainTrack = document.getElementById('chainTrack');
    const toast = document.getElementById('toast');

    let toastTimer;

    function showToast(msg, type = '') {
      toast.textContent = msg;
      toast.className = 'toast show ' + type;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.className = 'toast'; }, 2000);
    }

    function getOverlapFragment(word) {
      // Last 2 chars of the word become the fragment
      return word.slice(-2).toUpperCase();
    }

    function getOverlapLength(word, fragment) {
      // How many chars of the start of word match fragment
      const upper = word.toUpperCase();
      for (let len = fragment.length; len >= 2; len--) {
        if (upper.startsWith(fragment.slice(-len))) return len;
      }
      return 0;
    }

    function updateChainTrack() {
      chainTrack.innerHTML = '';
      state.wordsUsed.forEach((word, i) => {
        // Find how many leading chars are the "link" highlight
        let highlightLen = 2;
        if (i > 0) {
          const prev = state.wordsUsed[i - 1];
          const frag = getOverlapFragment(prev);
          highlightLen = frag.length;
        } else {
          highlightLen = 0; // first word, no highlight needed
        }

        const pill = document.createElement('div');
        pill.className = 'chain-pill';
        if (highlightLen > 0) {
          pill.innerHTML = `<span class="highlight">${word.slice(0, highlightLen)}</span>${word.slice(highlightLen)}`;
        } else {
          pill.textContent = word;
        }
        chainTrack.appendChild(pill);

        if (i < state.wordsUsed.length - 1) {
          const dot = document.createElement('div');
          dot.className = 'chain-connector';
          chainTrack.appendChild(dot);
        }
      });

      // Pending pill
      const dot = document.createElement('div');
      dot.className = 'chain-connector';
      chainTrack.appendChild(dot);

      const pending = document.createElement('div');
      pending.className = 'chain-pill current';
      pending.innerHTML = `<span class="dots">${state.currentFragment}•••</span>`;
      chainTrack.appendChild(pending);
    }

    function renderWordsUsed() {
      wordsUsedEl.innerHTML = '';
      state.wordsUsed.forEach(w => {
        const el = document.createElement('div');
        el.className = 'used-pill';
        el.textContent = w;
        wordsUsedEl.appendChild(el);
      });
    }

    function submitWord() {
      const raw = wordInput.value.trim().toUpperCase();
      if (!raw) return;

      if (raw.length < 3) {
        showToast('Word too short', 'error'); return;
      }
      if (!raw.startsWith(state.currentFragment)) {
        showToast(`Must start with "${state.currentFragment}"`, 'error'); return;
      }
      if (state.wordsUsed.includes(raw)) {
        showToast('Already used!', 'error'); return;
      }

      // Accept the word
      state.wordsUsed.push(raw);
      state.score += raw.length;
      state.currentFragment = getOverlapFragment(raw);

      scoreNum.textContent = state.score;
      chainFragment.textContent = state.currentFragment;
      hintFragment.textContent = state.currentFragment;
      wordInput.value = '';

      renderWordsUsed();
      updateChainTrack();
      showToast(`+${raw.length} pts`, 'success');
    }

    submitBtn.addEventListener('click', submitWord);
    wordInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitWord(); });

    // Init
    updateChainTrack();
    renderWordsUsed();
  </script>
</body>
</html>
